<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC.AI</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            startup: {
                typeset: false,
                ready: function() {
                    MathJax.startup.defaultReady();
                    MathJax.typesetPromise([document.body]).catch(function(error) {
                        console.error('MathJax initial typeset failed:', error);
                    });
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-rgb: 59, 130, 246;
            --success: #10b981;
            --danger: #ef4444;
            --ai-glow: linear-gradient(135deg, rgba(59, 130, 246, 0.06), rgba(139, 92, 246, 0.06));
            --radius: 12px;
            --transition: all 0.25s ease;

            /* Code editor theme — "fits all languages" (a balanced dark theme) */
            --code-bg: #1e1e2e;
            --code-panel: #181825;
            --code-border: #313244;
            --code-text: #cdd6f4;
            --code-muted: #6c7086;
            --code-line-num: #585b70;
            --code-gutter: #181825;
            --code-keyword: #cba6f7;
            --code-string: #a6e3a1;
            --code-comment: #6c7086;
            --code-number: #fab387;
            --code-func: #89b4fa;
            --code-tag: #f38ba8;
            --code-attr: #fab387;
            --code-punct: #9399b2;
        }

        [data-theme="dark"] {
            --bg-app: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #60a5fa;
            --primary-hover: #3b82f6;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --accent-rgb: 96, 165, 250;
            --ai-glow: linear-gradient(135deg, rgba(96, 165, 250, 0.1), rgba(168, 85, 247, 0.1));
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        :root {
            scrollbar-color: rgba(var(--accent-rgb), 0.55) var(--bg-card);
            scrollbar-width: thin;
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-card);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(var(--accent-rgb), 0.35);
            border: 3px solid var(--bg-card);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(var(--accent-rgb), 0.6);
        }

        ::-webkit-scrollbar-corner {
            background: var(--bg-card);
        }

        body {
            background: var(--bg-app);
            color: var(--text-main);
            transition: var(--transition);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(var(--accent-rgb), 0.03) 0%,
                rgba(139, 92, 246, 0.03) 50%,
                rgba(var(--accent-rgb), 0.03) 100%
            );
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        [data-theme="dark"] body::before {
            background: linear-gradient(
                135deg,
                rgba(var(--accent-rgb), 0.05) 0%,
                rgba(168, 85, 247, 0.05) 50%,
                rgba(var(--accent-rgb), 0.05) 100%
            );
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-card);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            gap: 20px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 1200;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            z-index: 1100;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }
            body.sidebar-open .sidebar { transform: translateX(0); }
            body.sidebar-open .sidebar-backdrop { display: block; opacity: 1; }
        }

        .logo-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.05em; color: var(--accent); }
        .logo-sub { font-size: 0.7rem; color: var(--text-muted); }

        .theme-toggle {
            background: none; border: 1px solid var(--border); padding: 8px; border-radius: 50%;
            cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center;
            transition: var(--transition); font-size: 0.9rem;
        }
        .theme-toggle:hover { background-color: var(--border); }

        .nav-section { display: flex; flex-direction: column; gap: 4px; }
        .nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 12px 0 6px; }

        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
            cursor: pointer; transition: var(--transition); font-weight: 500; font-size: 0.9rem;
            background: transparent; border: none; width: 100%; text-align: left; color: var(--text-main);
        }
        .nav-item:hover { background: var(--border); }
        .nav-item.active { background: rgba(var(--accent-rgb), 0.1); color: var(--accent); }
        .nav-icon { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex-shrink: 0; }

        /* ---------- Main layout ---------- */
        .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        /* ---------- Tab bar ---------- */
        .tab-bar {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            padding: 10px 16px 0;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
            position: relative;
        }
        .tab-bar::-webkit-scrollbar { height: 4px; }

        .sidebar-toggle {
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            margin: 0 4px 8px 0;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            flex-shrink: 0;
        }
        .sidebar-toggle svg { width: 16px; height: 16px; }
        @media (max-width: 768px) { .sidebar-toggle { display: flex; } }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            background: var(--bg-app);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            max-width: 200px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .tab:hover { color: var(--text-main); }
        .tab.active {
            background: var(--bg-app);
            color: var(--accent);
            font-weight: 600;
            border-color: var(--border);
            position: relative;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: var(--accent);
        }
        .tab-label { overflow: hidden; text-overflow: ellipsis; }
        .tab-close {
            display: flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 4px; border: none;
            background: transparent; color: var(--text-muted); cursor: pointer;
            font-size: 0.9rem; line-height: 1; flex-shrink: 0;
        }
        .tab-close:hover { background: var(--border); color: var(--danger); }

        .tab-add-btn {
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; margin: 0 0 6px 4px;
            border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-muted);
            cursor: pointer; font-size: 1.1rem; flex-shrink: 0;
            transition: var(--transition);
        }
        .tab-add-btn:hover { background: var(--border); color: var(--accent); }

        /* New tab landing page */
        .new-tab-page {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; padding: 40px;
        }
        .new-tab-title { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
        .new-tab-sub { color: var(--text-muted); font-size: 0.9rem; margin-top: -8px; }
        .new-tab-actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .new-tab-btn {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            padding: 28px 36px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text-main); cursor: pointer; font-size: 0.95rem; font-weight: 600;
            transition: var(--transition); min-width: 180px;
        }
        .new-tab-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb), 0.05); }
        .new-tab-btn svg { width: 32px; height: 32px; stroke: currentColor; }

        /* ---------- Content area ---------- */
        .content-area { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
        .page { flex: 1; overflow-y: auto; padding: 32px 40px; }
        .page.hidden { display: none; }
        @media (max-width: 768px) { .page { padding: 20px 16px; } }

        .page-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
        .page-title { font-size: 1.8rem; font-weight: 700; }

        /* ---------- Dashboard ---------- */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 900px) { .home-grid { grid-template-columns: 1fr; } }

        .home-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        [data-theme="dark"] .home-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .greeting-section { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
        .time-display { font-size: 2.5rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
        .date-display { color: var(--text-muted); font-size: 0.95rem; }

        .recent-chat-item {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            padding: 12px; margin: 8px 0;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px; border-left: 3px solid var(--accent);
            backdrop-filter: blur(8px); cursor: pointer;
            transition: var(--transition);
        }
        [data-theme="dark"] .recent-chat-item { background: rgba(15, 23, 42, 0.5); }
        .recent-chat-item:hover { border-left-color: var(--accent-hover); background: var(--border); }
        .recent-chat-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .recent-chat-meta { font-size: 0.8rem; color: var(--text-muted); flex-shrink: 0; }
        .empty-hint { color: var(--text-muted); font-size: 0.9rem; padding: 12px 0; }

        .btn {
            background: var(--accent); color: white; border: none; padding: 10px 20px;
            border-radius: 10px; cursor: pointer; font-weight: 600; transition: var(--transition);
        }
        .btn:hover { background: var(--accent-hover); }
        .btn.secondary { background: rgba(255, 255, 255, 0.5); color: var(--text-main); border: 1px solid var(--border); }
        [data-theme="dark"] .btn.secondary { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(51, 65, 85, 0.5); }
        .btn.secondary:hover { background: var(--border); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .quick-ai-ask {
            margin-top: 24px;
            background: var(--ai-glow);
            border: 1px solid rgba(var(--accent-rgb), 0.25);
            border-radius: var(--radius);
            padding: 20px 24px;
            backdrop-filter: blur(12px);
        }
        .quick-ai-ask-title { font-weight: 700; color: var(--accent); margin-bottom: 12px; font-size: 0.9rem; }
        .quick-ai-ask-form { display: flex; gap: 10px; }
        .quick-ai-ask-input {
            flex: 1; border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px;
            background: var(--bg-card); color: var(--text-main); font-size: 0.9rem;
        }
        .quick-ai-ask-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

        /* ---------- Chat interface ---------- */
        .chat-page { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
        .chat-header {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg-card);
            flex-shrink: 0;
        }
        .chat-header-title { font-size: 1.05rem; font-weight: 700; }
        .chat-header-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        .temp-badge {
            display: inline-block;
            margin-left: 8px;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            vertical-align: middle;
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--accent);
            padding: 2px 7px;
            border-radius: 999px;
        }
        .chat-rename-btn {
            border: 1px solid var(--border); background: transparent; color: var(--text-muted);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
            transition: var(--transition);
        }
        .chat-rename-btn:hover { background: var(--border); color: var(--text-main); }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .chat-msg { display: flex; gap: 12px; max-width: 760px; }
        .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .chat-msg-avatar {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700; color: white;
        }
        .chat-msg.ai .chat-msg-avatar { background: var(--accent); }
        .chat-msg.user .chat-msg-avatar { background: var(--text-muted); }
        .chat-msg-bubble {
            padding: 12px 16px; border-radius: 14px; font-size: 0.92rem; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word;
            overflow: hidden;
            contain: content;
        }
        .chat-msg.ai .chat-msg-bubble {
            background: var(--bg-card); border: 1px solid var(--border);
            border-top-left-radius: 4px;
        }
        .chat-msg.user .chat-msg-bubble {
            background: var(--accent); color: white;
            border-top-right-radius: 4px;
        }
        .chat-msg-time { font-size: 0.68rem; color: var(--text-muted); margin-top: 6px; }
        .chat-msg.user .chat-msg-time { text-align: right; }

        .chat-msg-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .chat-msg:hover .chat-msg-actions { opacity: 1; }
        .chat-msg-action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-msg-action-btn:hover {
            background: var(--border);
            color: var(--text-main);
        }
        .chat-msg.user .chat-msg-action-btn {
            border-color: var(--border);
            color: var(--text-muted);
            background: rgba(var(--accent-rgb), 0.05);
        }
        .chat-msg.user .chat-msg-action-btn:hover {
            background: var(--border);
            color: var(--text-main);
        }
        .chat-msg-action-btn.copied {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .code-block-wrapper {
            position: relative;
            margin: 6px 0;
        }
        .code-block-wrapper pre {
            background: var(--code-bg) !important;
            border: 1px solid var(--code-border) !important;
            border-radius: 6px;
            padding: 8px;
            margin: 0;
            overflow-x: auto;
            max-width: 100%;
        }
        .code-block-wrapper pre code {
            background: transparent !important;
            color: var(--code-text) !important;
        }
        .chat-msg-bubble .code-block-wrapper pre {
            background: var(--code-bg) !important;
        }
        .chat-msg-bubble .code-block-wrapper pre code {
            color: var(--code-text) !important;
        }
        .code-block-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(var(--accent-rgb), 0.15);
            border: 1px solid rgba(var(--accent-rgb), 0.3);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: var(--transition);
            z-index: 10;
        }
        .code-block-copy-btn:hover {
            background: rgba(var(--accent-rgb), 0.25);
        }
        .code-block-copy-btn.copied {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .edit-message-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-app);
            color: var(--text-main);
            font-size: 0.92rem;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            max-height: 200px;
        }
        .edit-message-input:focus {
            outline: 2px solid var(--accent);
            outline-offset: -1px;
        }
        .edit-message-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .edit-message-actions button {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .edit-message-actions .save-btn {
            background: var(--accent);
            color: white;
            border: none;
        }
        .edit-message-actions .save-btn:hover {
            background: var(--accent-hover);
        }
        .edit-message-actions .cancel-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .edit-message-actions .cancel-btn:hover {
            background: var(--border);
            color: var(--text-main);
        }

        .chat-empty {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; color: var(--text-muted); text-align: center; padding: 40px;
        }
        .chat-empty-logo { font-size: 2rem; font-weight: 700; color: var(--accent); letter-spacing: -0.04em; }

        .typing-indicator { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px 16px; 
            gap: 12px;
        }
        
        .ai-loading {
            position: relative;
            width: 40px;
            height: 40px;
        }
        
        .ai-loading-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--accent);
            border-right-color: var(--accent);
            animation: aiSpin 0.8s linear infinite;
        }
        
        .ai-loading-ring::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--accent);
            animation: aiSpin 1.2s linear infinite reverse;
        }
        
        .ai-loading-ring::after {
            content: '';
            position: absolute;
            top: 9px;
            left: 9px;
            right: 9px;
            bottom: 9px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--accent);
            animation: aiSpin 0.6s linear infinite;
        }
        
        @keyframes aiSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .typing-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.05em;
            animation: textFade 1.5s ease-in-out infinite;
        }
        
        @keyframes textFade {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .chat-input-area {
            padding: 16px 24px; border-top: 1px solid var(--border); background: var(--bg-card);
            flex-shrink: 0;
        }
        .chat-form { display: flex; gap: 10px; align-items: flex-end; max-width: 900px; margin: 0 auto; width: 100%; }
        .chat-input {
            flex: 1; border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px;
            background: var(--bg-app); color: var(--text-main); font-size: 0.92rem;
            resize: none; max-height: 160px; line-height: 1.5; font-family: inherit;
        }
        .chat-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

        /* ---------- Model selector button ---------- */
        .model-select-btn {
            display: flex; align-items: center; gap: 8px;
            border: 1px solid var(--border); background: var(--bg-app); color: var(--text-main);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
            transition: var(--transition); white-space: nowrap;
        }
        .model-select-btn:hover { background: var(--border); }
        .model-select-btn .chevron { font-size: 0.6rem; color: var(--text-muted); }

        /* ---------- Model selector modal ---------- */
        .model-modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
            display: none; align-items: center; justify-content: center; z-index: 3000;
        }
        .model-modal-overlay.open { display: flex; }
        .model-modal {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            width: min(94vw, 640px); max-height: 85vh; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.25);
        }
        .model-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
        }
        .model-modal-title { font-size: 1.05rem; font-weight: 700; }
        .model-modal-close {
            border: none; background: transparent; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 6px;
        }
        .model-modal-close:hover { background: var(--border); color: var(--text-main); }
        .model-modal-search {
            margin: 12px 16px; padding: 10px 14px; border: 1px solid var(--border);
            border-radius: 10px; background: var(--bg-app); color: var(--text-main);
            font-size: 0.9rem; flex-shrink: 0;
        }
        .model-modal-search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

        .model-modal-filters {
            display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; flex-shrink: 0;
        }
        .model-filter-chip {
            border: 1px solid var(--border); background: transparent; color: var(--text-muted);
            padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 0.78rem;
            font-weight: 500; transition: var(--transition);
        }
        .model-filter-chip:hover { background: var(--border); color: var(--text-main); }
        .model-filter-chip.active {
            background: rgba(var(--accent-rgb), 0.12); color: var(--accent); border-color: var(--accent);
        }

        .model-modal-list { overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
        .model-modal-group {
            font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-muted); padding: 10px 10px 4px; font-weight: 700;
        }
        .model-modal-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px; border: 1px solid transparent;
            background: transparent; color: var(--text-main);
            cursor: pointer; font-size: 0.88rem; text-align: left; width: 100%;
            transition: var(--transition);
        }
        .model-modal-item:hover { background: var(--border); }
        .model-modal-item.selected { background: rgba(var(--accent-rgb), 0.1); color: var(--accent); border-color: rgba(var(--accent-rgb), 0.3); }
        .model-modal-item-info { flex: 1; min-width: 0; }
        .model-modal-item-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .model-modal-item-desc { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; font-weight: 400; }
        .model-modal-item-check { color: var(--accent); font-weight: 700; flex-shrink: 0; }
        .model-modal-fav {
            border: none; background: transparent; cursor: pointer; font-size: 1rem;
            padding: 2px 4px; border-radius: 4px; flex-shrink: 0; transition: var(--transition);
            color: var(--text-muted);
        }
        .model-modal-fav:hover { background: var(--border); }
        .model-modal-fav.favorited { color: #f59e0b; }
        .model-modal-favs-header {
            font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: #f59e0b; padding: 6px 10px 4px; font-weight: 700;
        }
        .model-modal-empty { padding: 20px 14px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }

        .model-featured-badge {
            font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
            background: linear-gradient(135deg, #f59e0b, #ec4899); color: white;
            padding: 2px 6px; border-radius: 6px;
        }
        .model-cat-badge {
            font-size: 0.6rem; font-weight: 600; text-transform: uppercase;
            background: rgba(var(--accent-rgb), 0.1); color: var(--accent);
            padding: 2px 6px; border-radius: 6px;
        }

        /* ---------- Chat manager (My Chats) ---------- */
        .chat-manager-toolbar {
            display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
        }
        .chat-manager-search {
            flex: 1; min-width: 200px;
            border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px;
            background: var(--bg-card); color: var(--text-main); font-size: 0.9rem;
        }
        .chat-manager-search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        .chat-manager-list { display: flex; flex-direction: column; gap: 10px; }
        .chat-manager-item {
            display: flex; align-items: center; gap: 14px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            padding: 16px 20px;
            backdrop-filter: blur(16px);
            transition: var(--transition);
            cursor: pointer;
        }
        [data-theme="dark"] .chat-manager-item {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .chat-manager-item:hover { border-color: var(--accent); }
        .chat-manager-item-info { flex: 1; min-width: 0; }
        .chat-manager-item-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-manager-item-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .chat-manager-item-model {
            font-size: 0.72rem; background: rgba(var(--accent-rgb), 0.1); color: var(--accent);
            padding: 2px 8px; border-radius: 6px; font-weight: 500; white-space: nowrap;
        }
        .chat-manager-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .chat-action-btn {
            border: 1px solid var(--border); background: transparent; color: var(--text-muted);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.78rem;
            transition: var(--transition);
        }
        .chat-action-btn:hover { background: var(--border); color: var(--text-main); }
        .chat-action-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
        .chat-manager-empty {
            text-align: center; color: var(--text-muted); padding: 48px 20px; font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            .chat-manager-item { flex-direction: column; align-items: stretch; gap: 10px; }
            .chat-manager-item-actions { justify-content: flex-end; }
        }

        /* ---------- Files page (split: explorer + editor) ---------- */
        .files-page {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }
        .files-toolbar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-card);
            flex-shrink: 0;
        }
        .files-toolbar-title { font-size: 1rem; font-weight: 700; }
        .files-toolbar-actions { display: flex; gap: 8px; align-items: center; }
        .files-chat-select {
            border: 1px solid var(--border); background: var(--bg-app); color: var(--text-main);
            padding: 6px 10px; border-radius: 8px; font-size: 0.82rem; cursor: pointer;
            max-width: 220px;
        }
        .files-split { flex: 1; display: flex; overflow: hidden; min-height: 0; }

        .file-explorer {
            width: 280px; flex-shrink: 0;
            background: var(--bg-card); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .file-explorer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; border-bottom: 1px solid var(--border);
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        .file-explorer-search {
            margin: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg-app); color: var(--text-main); font-size: 0.82rem; flex-shrink: 0;
        }
        .file-explorer-search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        .file-tree { flex: 1; overflow-y: auto; padding: 4px 8px 12px; font-size: 0.84rem; }
        .file-tree-node {
            display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px;
            cursor: pointer; white-space: nowrap; transition: var(--transition); user-select: none;
        }
        .file-tree-node:hover { background: var(--border); }
        .file-tree-node.active { background: rgba(var(--accent-rgb), 0.12); color: var(--accent); }
        .file-tree-node .ft-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .file-tree-node .ft-name { overflow: hidden; text-overflow: ellipsis; }
        .file-tree-root {
            margin-bottom: 6px;
            padding-bottom: 0;
            border: none;
        }
        .file-tree-root .file-tree-node {
            font-weight: 600;
            background: rgba(var(--accent-rgb), 0.06);
        }
        .file-tree-folder .ft-chevron { width: 12px; height: 12px; transition: transform 0.15s ease; flex-shrink: 0; }
        .file-tree-folder.collapsed .ft-chevron { transform: rotate(-90deg); }
        .file-tree-children { display: flex; flex-direction: column; }
        .file-tree-folder.collapsed + .file-tree-children { display: none; }
        .file-explorer-empty { padding: 20px 14px; text-align: center; color: var(--text-muted); font-size: 0.82rem; }

        .file-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        .file-editor-tabs {
            display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0;
            background: var(--code-panel); border-bottom: 1px solid var(--code-border);
            overflow-x: auto; flex-shrink: 0;
        }
        .file-editor-tab {
            display: flex; align-items: center; gap: 6px; padding: 7px 12px;
            background: var(--code-bg); color: var(--code-muted); border: 1px solid var(--code-border);
            border-bottom: none; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 0.78rem;
            white-space: nowrap; flex-shrink: 0;
        }
        .file-editor-tab .ft-icon {
            width: 15px;
            height: 15px;
            flex: 0 0 15px;
        }
        .file-editor-tab .file-tab-label {
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }
        .file-editor-tab.active { color: var(--code-text); }
        .file-editor-tab .fet-close { opacity: 0.6; font-size: 0.9rem; }
        .file-editor-tab .fet-close:hover { opacity: 1; color: var(--danger); }

        .file-editor-bar {
            display: flex; align-items: center; gap: 10px; padding: 6px 14px;
            background: var(--code-panel); border-bottom: 1px solid var(--code-border);
            font-size: 0.74rem; color: var(--code-muted); flex-shrink: 0;
        }
        .file-editor-bar .current-path { font-family: ui-monospace, monospace; }
        .file-editor-bar .dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: #f9e2af; display: none; }
        .file-editor-bar .dirty-dot.show { display: inline-block; }
        .file-editor-bar .spacer { flex: 1; }
        .file-editor-bar .save-btn {
            background: rgba(var(--accent-rgb), 0.15); color: var(--accent); border: 1px solid rgba(var(--accent-rgb), 0.3);
            padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.76rem; font-weight: 600;
        }
        .file-editor-bar .save-btn:hover { background: rgba(var(--accent-rgb), 0.25); }

        .code-area { flex: 1; display: flex; overflow: hidden; min-height: 0; background: var(--code-bg); }
        .code-gutter {
            width: 48px; flex-shrink: 0; padding: 12px 8px 12px 0; text-align: right;
            color: var(--code-line-num); background: var(--code-gutter); border-right: 1px solid var(--code-border);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px; line-height: 1.6; overflow: hidden; user-select: none;
        }
        .code-gutter div { height: 1.6em; }
        .code-wrap { flex: 1; position: relative; overflow: hidden; }
        .code-textarea {
            position: absolute; inset: 0; margin: 0; padding: 12px 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px; line-height: 1.6; tab-size: 2; white-space: pre; overflow: auto;
            border: none; outline: none; resize: none; word-wrap: normal; box-sizing: border-box;
            color: var(--code-text);
            caret-color: var(--code-text);
            background: transparent;
            z-index: 2;
            -webkit-text-fill-color: var(--code-text);
            -webkit-caret-color: var(--code-text);
            font-variant-ligatures: none;
            font-synthesis: none;
            scrollbar-width: none;
        }
        .code-textarea::selection {
            background: rgba(var(--accent-rgb), 0.28);
        }
        .code-textarea::-webkit-scrollbar {
            display: none;
        }

        .file-editor-empty {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; color: var(--code-muted); text-align: center; padding: 40px;
            background: var(--code-bg);
        }
        .file-editor-empty-title { font-size: 1.1rem; font-weight: 700; color: var(--code-text); }

        /* ---------- Placeholder pages (Forge) ---------- */
        .placeholder-page {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; color: var(--text-muted); text-align: center; padding: 40px;
        }
        .placeholder-title { font-size: 1.3rem; font-weight: 700; color: var(--text-main); }

        /* ---------- Settings modal ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
            display: none; align-items: center; justify-content: center; z-index: 3000;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            width: min(92vw, 480px); max-height: 80vh; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.25);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 20px; border-bottom: 1px solid var(--border); background: var(--bg-app);
        }
        .modal-title { font-size: 1.1rem; font-weight: 700; }
        .modal-close {
            border: none; background: transparent; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 6px;
        }
        .modal-close:hover { background: var(--border); color: var(--text-main); }
        .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .settings-row-label { font-weight: 600; font-size: 0.9rem; }
        .settings-row-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        .accent-color-input {
            width: 40px; height: 40px; border: 2px solid var(--border); border-radius: 10px;
            cursor: pointer; padding: 2px; background: var(--bg-card);
            transition: var(--transition);
        }
        .accent-color-input:hover { border-color: var(--accent); }
        .accent-presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .accent-preset {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
            cursor: pointer; transition: var(--transition);
        }
        .accent-preset:hover { transform: scale(1.15); }
        .accent-preset.active { border-color: var(--text-main); box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--text-main); }

        /* ---------- Markdown & Math Formatting ---------- */
        .chat-msg-bubble {
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
        }
        .chat-msg-bubble strong {
            font-weight: 700;
        }
        .chat-msg-bubble em {
            font-style: italic;
        }
        .chat-msg-bubble h1,
        .chat-msg-bubble h2,
        .chat-msg-bubble h3,
        .chat-msg-bubble h4,
        .chat-msg-bubble h5,
        .chat-msg-bubble h6 {
            color: var(--accent);
            line-height: 1.2;
            margin: 12px 0 6px;
            font-weight: 700;
        }
        .chat-msg-bubble h1 { font-size: 1.35rem; }
        .chat-msg-bubble h2 { font-size: 1.2rem; }
        .chat-msg-bubble h3 { font-size: 1.08rem; }
        .chat-msg-bubble h4,
        .chat-msg-bubble h5,
        .chat-msg-bubble h6 { font-size: 1rem; }
        .chat-msg-bubble p { margin: 0 0 8px; }
        .chat-msg-bubble p:last-child { margin-bottom: 0; }
        .chat-msg-bubble a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .chat-msg-bubble blockquote {
            border-left: 3px solid var(--accent);
            color: var(--text-muted);
            margin: 8px 0;
            padding: 4px 0 4px 12px;
        }
        .chat-msg-bubble hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }
        .chat-msg-bubble ul,
        .chat-msg-bubble ol {
            margin: 6px 0 8px 20px;
            padding-left: 12px;
        }
        .chat-msg-bubble code {
            background: rgba(var(--accent-rgb), 0.1);
            padding: 1px 4px;
            border-radius: 3px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85em;
        }
        .chat-msg-bubble pre {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: 6px;
            padding: 8px;
            margin: 6px 0;
            overflow-x: auto;
            max-width: 100%;
        }
        .chat-msg-bubble pre code {
            background: transparent;
            padding: 0;
            color: var(--code-text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85em;
            line-height: 1.4;
        }
        .chat-msg-bubble li {
            margin: 2px 0;
            padding-left: 0;
            position: relative;
        }
        
        /* Tables */
        .chat-msg-bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 0.9em;
        }
        .chat-msg-bubble th {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: left;
            background: rgba(var(--accent-rgb), 0.05);
            font-weight: 600;
        }
        .chat-msg-bubble td {
            border: 1px solid var(--border);
            padding: 8px;
        }
        
        .chat-msg-bubble mjx-container {
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .chat-msg-bubble mjx-container[display="true"] {
            margin: 10px 0;
            padding: 2px 0;
        }

        /* ---------- Optimise Prompt Button ---------- */
        .optimise-btn {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .optimise-btn:hover {
            background: linear-gradient(135deg, var(--accent-hover), #7c3aed);
            transform: translateY(-1px);
        }
        .optimise-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ---------- Questionnaire Modal ---------- */
        .questionnaire-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 4000;
        }
        .questionnaire-modal-overlay.open {
            display: flex;
        }
        .questionnaire-modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: min(94vw, 600px);
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.3);
        }
        .questionnaire-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-app);
        }
        .questionnaire-modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }
        .questionnaire-modal-close {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            transition: var(--transition);
        }
        .questionnaire-modal-close:hover {
            background: var(--border);
            color: var(--text-main);
        }
        .questionnaire-modal-body {
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .questionnaire-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;

    <script>
        // ============================================================
        // SC.AI — state & persistence (localStorage)
        //
        // Storage layout:
        //   scai_state        -> app state (theme, accent, tabs, selected model, favorites, chat index)
        //   scai_fs           -> virtual file system: { "<chatId>/messages.json": "...", "<chatId>/file.js": "..." }
        //
        // Each chat owns a folder "<chatId>/" containing:
        //   - messages.json : OpenAI-format array [{role:"user"|"assistant"|"system", content:"..."}]
        //   - any other files the user creates in the Files tab
        // ============================================================
        const STORAGE_KEY = 'scai_state';
        const FS_KEY = 'scai_fs';
        const API_BASE = 'https://sc-ai-backend.chibbit99.workers.dev';
        const MODELS_ENDPOINT = API_BASE + '/models';
        const CHAT_ENDPOINT = API_BASE + '/v1/chat/completions';

        const ACCENT_PRESETS = [
            '#3b82f6', '#8b5cf6', '#ec4899', '#f43f5e', '#f97316',
            '#eab308', '#10b981', '#06b6d4', '#6366f1', '#14b8a6'
        ];

        let state = {
            theme: 'light',
            accentColor: '#3b82f6',
            chats: {},          // { [id]: { id, title, createdAt, updatedAt, model } }
            openTabs: ['dashboard'],
            activeTab: 'dashboard',
            selectedModel: 'codestral-2508',
            favoriteModels: [],
            availableModels: []  // Will be populated from API
        };

        // Virtual file system: { "path": "content" }
        let FS = {};

        // ============================================================
        // Temporary chats — in-memory only. Never written to localStorage
        // and never given a folder in the virtual file system, so they
        // don't appear in the Files explorer, My Chats, or the dashboard.
        // They live only for the lifetime of the tab / page session.
        // ============================================================
        let tempChats = {};      // { [id]: { id, title, createdAt, updatedAt, model, temporary:true } }
        let tempMessages = {};   // { [id]: [ {role, content}, ... ] }
        function isTempChat(id) { return !!(id && tempChats[id]); }
        function getChat(id) { return state.chats[id] || tempChats[id] || null; }


        // ============================================================
        // Markdown + MathJax Renderer
        // This overrides the legacy formatter above. Math is preserved as TeX
        // for MathJax; Markdown is parsed by marked when the CDN is available.
        // ============================================================
        function renderMarkdown(text) {
            const source = protectMath(text || '');
            let html;

            if (window.marked) {
                marked.setOptions({
                    gfm: true,
                    breaks: true,
                    mangle: false,
                    headerIds: false
                });
                if (window.DOMPurify) {
                    html = marked.parse(source.text);
                    html = DOMPurify.sanitize(html);
                } else {
                    html = marked.parse(escHtml(source.text));
                }
            } else {
                html = fallbackMarkdown(source.text);
            }

            html = restoreMath(html, source.math);
            return normalizeRenderedMarkdown(html);
        }

        function formatStreamingMarkdown(text) {
            return renderMarkdown(text);
        }

        function protectMath(text) {
            const math = [];
            const source = text.replace(/(```[\s\S]*?```|`[^`\n]*`)|(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|(?<!\\)\$(?!\s)(?:\\.|[^$\n])+(?<!\\)\$)/g, function(match, code, tex) {
                if (code) return code;
                const token = '%%SCAI_MATH_' + math.length + '%%';
                math.push(tex);
                return token;
            });
            return { text: source, math: math };
        }

        function restoreMath(html, math) {
            return html.replace(/%%SCAI_MATH_(\d+)%%/g, function(match, index) {
                return escHtml(math[Number(index)] || match);
            });
        }

        function normalizeRenderedMarkdown(html) {
            // Wrap code blocks with copy button and inline styles
            html = html.replace(/<pre><code([^>]*)>([\s\S]*?)<\/code><\/pre>/g, function(match, attrs, code) {
                return '<div class="code-block-wrapper">' +
                       '<button class="code-block-copy-btn" onclick="copyCodeBlock(this)">Copy</button>' +
                       '<pre style="background: #1e1e2e; border: 1px solid #313244; border-radius: 6px; padding: 8px; margin: 6px 0; overflow-x: auto; max-width: 100%;"><code' + attrs + ' style="background: transparent; color: #cdd6f4;">' + code + '</code></pre>' +
                       '</div>';
            });
            return html;
        }

        function fallbackMarkdown(text) {
            let html = escHtml(text);
            html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
            html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
            html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                return '<div class="code-block-wrapper">' +
                       '<button class="code-block-copy-btn" onclick="copyCodeBlock(this)">Copy</button>' +
                       '<pre style="background: #1e1e2e; border: 1px solid #313244; border-radius: 6px; padding: 8px; margin: 6px 0; overflow-x: auto; max-width: 100%;"><code style="background: transparent; color: #cdd6f4;">' + code + '</code></pre>' +
                       '</div>';
            });
            html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        const mathTypesetTimers = new WeakMap();

        function typesetMathIn(element) {
            if (!element || !window.MathJax || !MathJax.typesetPromise) return;
            const existingTimer = mathTypesetTimers.get(element);
            if (existingTimer) clearTimeout(existingTimer);
            const timer = setTimeout(function() {
                mathTypesetTimers.delete(element);
                if (MathJax.typesetClear) MathJax.typesetClear([element]);
                MathJax.typesetPromise([element]).catch(function(error) {
                    console.error('MathJax typeset failed:', error);
                });
            }, 80);
            mathTypesetTimers.set(element, timer);
        }

        // ============================================================
        // API Functions
        // ============================================================
        function formatModelName(modelId) {
            // Format model ID to readable name
            // e.g., "vendouple/qwen3.6-27b" -> "Qwen 3.6-27b"
            // e.g., "Spit-fires/LFM2.5-230M" -> "LFM 2.5-230M"
            // e.g., "codestral-2508" -> "Codestral 2508"
            const parts = modelId.split('/');
            const lastPart = parts[parts.length - 1];
            
            // Handle special cases
            if (lastPart === 'polly') return 'Polly';
            if (lastPart === 'qwen-safety') return 'Qwen Safety';
            
            // Convert to title case and add spaces before numbers
            let name = lastPart
                .replace(/[-_]/g, ' ')
                .replace(/([a-z])([A-Z])/g, '$1 $2')
                .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
                .toLowerCase()
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
            
            // Add spaces before numbers if needed
            name = name.replace(/([a-zA-Z])(\d)/g, '$1 $2');
            
            return name;
        }

        async function fetchModels() {
            try {
                const response = await fetch(MODELS_ENDPOINT);
                const data = await response.json();
                if (data && data.data && Array.isArray(data.data)) {
                    state.availableModels = data.data.map(function (model) {
                        return {
                            id: model.id,
                            name: formatModelName(model.id),
                            desc: model.owned_by || 'Community',
                            group: model.owned_by || 'Community',
                            category: 'general',
                            featured: false
                        };
                    });
                    // Set default model if not already set
                    if (!state.selectedModel || !state.availableModels.find(m => m.id === state.selectedModel)) {
                        state.selectedModel = state.availableModels[0]?.id || 'codestral-2508';
                    }
                    saveState();
                    return state.availableModels;
                }
            } catch (error) {
                console.error('Failed to fetch models:', error);
                // Fallback to default models if fetch fails
                state.availableModels = AVAILABLE_MODELS;
                return state.availableModels;
            }
        }

        const STATIC_TABS = ['dashboard', 'mychats', 'forge', 'files', 'newtab'];

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                }
            } catch (e) { /* ignore corrupt state */ }
            try {
                const fsSaved = localStorage.getItem(FS_KEY);
                if (fsSaved) FS = JSON.parse(fsSaved) || {};
            } catch (e) { FS = {}; }

            if (!state.openTabs.includes('dashboard')) state.openTabs.unshift('dashboard');
            state.openTabs = state.openTabs.filter(function (id) {
                return STATIC_TABS.includes(id) || state.chats[id];
            });
            if (!state.openTabs.includes(state.activeTab)) state.activeTab = 'dashboard';
            Object.values(state.chats).forEach(function (chat) {
                if (!chat.model) chat.model = state.selectedModel || 'sc-core-1';
                // Ensure each chat has a messages.json
                ensureChatFolder(chat.id);
            });
        }

        function saveState() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        }

        function saveFS() {
            try { localStorage.setItem(FS_KEY, JSON.stringify(FS)); } catch (e) {}
        }

        // ============================================================
        // File system helpers (per-chat folders + messages.json)
        // ============================================================
        function chatDir(chatId) { return chatId + '/'; }
        function chatMessagesPath(chatId) { return chatId + '/messages.json'; }

        function ensureChatFolder(chatId) {
            // Temporary chats never touch the virtual file system.
            if (isTempChat(chatId)) {
                if (!tempMessages[chatId]) tempMessages[chatId] = [];
                return;
            }
            const path = chatMessagesPath(chatId);
            if (!(path in FS)) {
                FS[path] = '[]';
                saveFS();
            }
        }

        // Read OpenAI-format messages for a chat
        function readChatMessages(chatId) {
            // Temporary chats keep their messages only in memory.
            if (isTempChat(chatId)) {
                if (!tempMessages[chatId]) tempMessages[chatId] = [];
                return tempMessages[chatId];
            }
            const path = chatMessagesPath(chatId);
            ensureChatFolder(chatId);
            try {
                const arr = JSON.parse(FS[path] || '[]');
                return Array.isArray(arr) ? arr : [];
            } catch (e) { return []; }
        }

        // Write OpenAI-format messages for a chat
        function writeChatMessages(chatId, messages) {
            // Temporary chats keep their messages only in memory.
            if (isTempChat(chatId)) {
                tempMessages[chatId] = messages;
                return;
            }
            const path = chatMessagesPath(chatId);
            FS[path] = JSON.stringify(messages, null, 2);
            saveFS();
        }

        // Convert internal msg {role, text, ts} -> OpenAI {role, content}
        // We keep role as-is; 'ai' maps to 'assistant'.
        function toOpenAIRole(role) { return role === 'ai' ? 'assistant' : role; }
        function fromOpenAIRole(role) { return role === 'assistant' ? 'ai' : role; }

        // Append a message to a chat's messages.json (OpenAI format)
        function appendMessageToFS(chatId, role, text) {
            const messages = readChatMessages(chatId);
            messages.push({ role: toOpenAIRole(role), content: text });
            writeChatMessages(chatId, messages);
        }

        // List files belonging to a chat folder
        function listChatFiles(chatId) {
            const prefix = chatDir(chatId);
            return Object.keys(FS).filter(function (p) { return p.startsWith(prefix); }).sort();
        }

        // Delete all files for a chat folder
        function deleteChatFolder(chatId) {
            const prefix = chatDir(chatId);
            Object.keys(FS).forEach(function (p) {
                if (p.startsWith(prefix)) delete FS[p];
            });
            saveFS();
        }

        // ============================================================
        // Theme
        // ============================================================
        function applyTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = state.theme === 'dark' ? '🌙' : '☀️';
        }
        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme();
            applyAccentColor();
            saveState();
        }

        // ============================================================
        // Accent Color
        // ============================================================
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return r + ', ' + g + ', ' + b;
        }
        function darkenHex(hex, amount) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            r = Math.max(0, r - amount); g = Math.max(0, g - amount); b = Math.max(0, b - amount);
            return '#' + [r, g, b].map(function (c) { return c.toString(16).padStart(2, '0'); }).join('');
        }
        function lightenHex(hex, amount) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            r = Math.min(255, r + amount); g = Math.min(255, g + amount); b = Math.min(255, b + amount);
            return '#' + [r, g, b].map(function (c) { return c.toString(16).padStart(2, '0'); }).join('');
        }
        function applyAccentColor() {
            const root = document.documentElement;
            const color = state.accentColor;
            const hoverColor = state.theme === 'dark' ? lightenHex(color, 30) : darkenHex(color, 30);
            const rgb = hexToRgb(color);

        function sendMessage(event, chatId) {
            event.preventDefault();
            const input = document.getElementById('chatInput-' + chatId);
            const text = input.value.trim();
            if (!text) return;
            const chat = getChat(chatId);

            if (chat.title === 'New Chat' || chat.title === 'Temporary Chat') {
                const msgs = readChatMessages(chatId);
                if (msgs.length === 1) {

            render();
            showTyping(chatId);

            // Real AI response with streaming
            streamAiResponse(chatId, text, chat.model || state.selectedModel);
        }

        async function streamAiResponse(chatId, userText, modelId) {
            const messages = readChatMessages(chatId);
            // Convert to OpenAI format (assistant -> ai)
            const apiMessages = messages.map(function (m) {
                return {
                    role: m.role === 'ai' ? 'assistant' : m.role,
                    content: m.content
                };
            });

            // Remove typing indicator and create AI message bubble with loading animation
            removeTyping(chatId);
            const messagesEl = document.getElementById('chatMessages-' + chatId);
            if (!messagesEl) return;

            const wrap = document.createElement('div');
            wrap.className = 'chat-msg ai';
            wrap.id = 'ai-response-' + chatId;
            wrap.innerHTML =
                '<div class="chat-msg-avatar">AI</div>' +
                '<div class="chat-msg-bubble"><div class="typing-indicator">' +
                '<div class="ai-loading">' +
                '<div class="ai-loading-ring"></div>' +
                '</div>' +
                '<span class="typing-text">AI is thinking</span>' +
                '</div></div>';
            messagesEl.appendChild(wrap);
            const bubble = wrap.querySelector('.chat-msg-bubble');
            messagesEl.scrollTop = messagesEl.scrollHeight;

            let fullResponse = '';

            try {
                const response = await fetch(CHAT_ENDPOINT + '?format=text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: modelId,
                        messages: apiMessages,
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error('API request failed: ' + response.statusText);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value, { stream: true });
                    fullResponse += text;
                    
                    // Only replace loading animation once we have actual content
                    if (fullResponse.trim()) {
                        bubble.innerHTML = formatStreamingMarkdown(fullResponse);
                        typesetMathIn(bubble);
                    }
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                }

                // Save the complete response
                appendMessageToFS(chatId, 'ai', fullResponse);
                const doneChat = getChat(chatId);
                if (doneChat) doneChat.updatedAt = Date.now();
                if (!isTempChat(chatId)) saveState();

                // Re-render to show the final message properly
                if (state.activeTab === chatId) {
                    render();
                }

            } catch (error) {
                console.error('Error streaming AI response:', error);
                bubble.textContent = 'Error: ' + error.message;
                appendMessageToFS(chatId, 'ai', 'Error: ' + error.message);
                const errChat = getChat(chatId);
                if (errChat) errChat.updatedAt = Date.now();
                if (!isTempChat(chatId)) saveState();
            }
        }

        function copyMessageText(text, button) {
            navigator.clipboard.writeText(text).then(function () {

                    button.innerHTML = '✓ Copied';
                    button.classList.add('copied');
                    setTimeout(function () {

            }).catch(function (err) {

            });
        }

        function editUserMessage(chatId, msgIndex, originalText, bubble, actions) {
            // Hide action buttons and show inline editor
            actions.style.display = 'none';
            
            const originalContent = bubble.innerHTML;
            bubble.innerHTML = '';
            
            const textarea = document.createElement('textarea');
            textarea.className = 'edit-message-input';
            textarea.value = originalText;
            textarea.onkeydown = function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    saveEdit();
                }
            };
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'edit-message-actions';
            
            const saveBtn = document.createElement('button');
            saveBtn.className = 'save-btn';
            saveBtn.textContent = 'Save';
            saveBtn.onclick = saveEdit;
            
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'cancel-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = cancelEdit;
            
            actionsDiv.appendChild(saveBtn);
            actionsDiv.appendChild(cancelBtn);
            
            bubble.appendChild(textarea);
            bubble.appendChild(actionsDiv);
            textarea.focus();
            
            function saveEdit() {
                const newText = textarea.value.trim();
                if (newText === '' || newText === originalText) {
                    cancelEdit();
                    return;
                }

                const messages = readChatMessages(chatId);
                if (msgIndex >= messages.length) return;

                // Update the user message in place
                messages[msgIndex].content = newText;
                
                // Remove all AI responses after this message
                messages.splice(msgIndex + 1);
                
                writeChatMessages(chatId, messages);
                
                const chat = getChat(chatId);
                if (chat) chat.updatedAt = Date.now();
                if (!isTempChat(chatId)) saveState();
                
                // Trigger new AI response
                render();
                showTyping(chatId);
                
                streamAiResponse(chatId, newText, (chat && chat.model) || state.selectedModel);
            }
            
            function cancelEdit() {
                bubble.innerHTML = originalContent;
                actions.style.display = 'flex';
            }
        }

        function renderChatManagerList(list) {
            list.innerHTML = '';

            const chats = Object.values(state.chats)
                .sort(function (a, b) { return b.updatedAt - a.updatedAt; })
                .filter(function (chat) {

                    if (chat.title.toLowerCase().includes(q)) return true;
                    const modelName = modelById(chat.model || state.selectedModel).name.toLowerCase();
                    if (modelName.includes(q)) return true;
                    return readChatMessages(chat.id).some(function (m) {
                        return (m.content || '').toLowerCase().includes(q);
                    });
                });

            if (chats.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'chat-manager-empty';
                empty.textContent = q ? 'No chats match "' + chatManagerQuery.trim() + '".' : 'No chats yet. Create your first chat to get started.';

                item.onclick = function () { openTab(chat.id); };
                const info = document.createElement('div');

                const msgCount = readChatMessages(chat.id).length;
                const msgCountEl = document.createElement('span');
                msgCountEl.textContent = msgCount + ' message' + (msgCount === 1 ? '' : 's');
                const lastUsed = document.createElement('span');
                const d = new Date(chat.updatedAt);
                const now = new Date();
                const diffMs = now - d;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);
                if (diffMins < 1) lastUsed.textContent = 'Just now';
                else if (diffMins < 60) lastUsed.textContent = diffMins + 'm ago';
                else if (diffHours < 24) lastUsed.textContent = diffHours + 'h ago';
                else if (diffDays < 7) lastUsed.textContent = diffDays + 'd ago';
                else lastUsed.textContent = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
                meta.appendChild(modelBadge); meta.appendChild(msgCountEl); meta.appendChild(lastUsed);
                info.appendChild(t); info.appendChild(meta);

                const actions = document.createElement('div');
                actions.className = 'chat-manager-item-actions';
                const openBtn = document.createElement('button');
                openBtn.className = 'chat-action-btn'; openBtn.textContent = 'Open';

                const renameBtn = document.createElement('button');

            const models = state.availableModels.length > 0 ? state.availableModels : AVAILABLE_MODELS;
            return models.find(function (m) { return m.id === id; }) || models[0];
        }

        function openModelModal() {
            document.getElementById('modelModal').classList.add('open');
            const searchInput = document.getElementById('modelSearchInput');
            searchInput.value = '';
            modelFilterCategory = 'all';
            renderModelFilters();
            renderModelModalList();
