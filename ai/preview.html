        function renderModelFilters() {
            const container = document.getElementById('modelFilters');
            container.innerHTML = '';
            MODEL_CATEGORIES.forEach(function (cat) {
                const chip = document.createElement('button');
                chip.className = 'model-filter-chip' + (modelFilterCategory === cat.id ? ' active' : '');
                chip.textContent = cat.label;
                chip.onclick = function () { modelFilterCategory = cat.id; renderModelFilters(); renderModelModalList(); };
                container.appendChild(chip);
            });
        }

        function renderModelModalList() {
            const list = document.getElementById('modelModalList');
            const query = (document.getElementById('modelSearchInput').value || '').trim().toLowerCase();
            list.innerHTML = '';

            let filtered = state.availableModels.length > 0 ? state.availableModels : AVAILABLE_MODELS;
            if (modelFilterCategory !== 'all') {
                filtered = filtered.filter(function (m) { return m.category === modelFilterCategory; });
            }
            if (query) {
                filtered = filtered.filter(function (m) {
                    return m.name.toLowerCase().includes(query) ||
                           m.desc.toLowerCase().includes(query) ||
                           m.group.toLowerCase().includes(query) ||
                           m.category.toLowerCase().includes(query);
                });
            }

            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'model-modal-empty';
                empty.textContent = 'No models match your filters.';
                list.appendChild(empty);
                return;
            }

            // Featured section first
            const featured = filtered.filter(function (m) { return m.featured; });
            if (featured.length > 0 && modelFilterCategory === 'all' && !query) {
                const fHeader = document.createElement('div');
                fHeader.className = 'model-modal-group';
                fHeader.style.background = 'linear-gradient(135deg, rgba(245,158,11,0.08), rgba(236,72,153,0.08))';
                fHeader.style.borderRadius = '8px';
                fHeader.textContent = '★ Featured';
                list.appendChild(fHeader);
                featured.forEach(function (model) { list.appendChild(createModelItem(model, true)); });
            }

            // Favorites
            const favModels = filtered.filter(function (m) { return state.favoriteModels.includes(m.id); });
            if (favModels.length > 0) {
                const favHeader = document.createElement('div');
                favHeader.className = 'model-modal-favs-header';
                favHeader.textContent = '★ Favorites';
                list.appendChild(favHeader);
                favModels.forEach(function (model) { list.appendChild(createModelItem(model, false)); });
            }

            // Remaining grouped
            const shown = new Set();
            featured.forEach(function (m) { shown.add(m.id); });
            favModels.forEach(function (m) { shown.add(m.id); });
            const others = filtered.filter(function (m) { return !shown.has(m.id); });
            let lastGroup = null;
            others.forEach(function (model) {
                if (model.group !== lastGroup) {
                    lastGroup = model.group;
                    const groupEl = document.createElement('div');
                    groupEl.className = 'model-modal-group';
                    groupEl.textContent = model.group;
                    list.appendChild(groupEl);
                }
                list.appendChild(createModelItem(model, false));
            });
        }

        function createModelItem(model, isFeatured) {
            const item = document.createElement('button');
            item.className = 'model-modal-item' + (state.selectedModel === model.id ? ' selected' : '');
            item.onclick = function () {

            name.textContent = model.name;

                badge.className = 'model-featured-badge';
                badge.textContent = 'Featured';
                name.appendChild(badge);
            }
            const catBadge = document.createElement('span');

            const idx = state.favoriteModels.indexOf(modelId);

            sendBtn.className = 'btn'; sendBtn.type = 'submit'; sendBtn.textContent = 'Send';

        // ============================================================
        // FILES PAGE — split screen: file explorer + code editor

        let filesState = {
            selectedChat: null,   // chat id currently browsed
            openFile: null,       // full path currently open
            openTabs: [],         // open file paths
            dirty: {},            // { path: bool }
            collapsed: {},        // folder collapse state
            search: '',
            autosaveTimer: null
        };

        function renderFilesPage() {
            const page = document.createElement('div');
            page.className = 'page files-page';

            // Toolbar
            const toolbar = document.createElement('div');

        function renderFileExplorer() {

        function renderFileTreeInto(container) {
            container.innerHTML = '';
            const chats = Object.values(state.chats).sort(function (a, b) { return b.updatedAt - a.updatedAt; });
            const q = filesState.search.trim().toLowerCase();
            if (chats.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'file-explorer-empty';
                empty.textContent = 'Select a chat above to browse its files.';
                container.appendChild(empty);
                return;
            }
            const forest = document.createElement('div');
            forest.className = 'file-tree-forest';
            let visibleCount = 0;
            chats.forEach(function (chat) {
                let files = listChatFiles(chat.id);
                if (q) files = files.filter(function (p) { return p.toLowerCase().includes(q); });
                if (files.length === 0) {
                    if (!q) {
                        files = [chatMessagesPath(chat.id)];
                    } else {
                        return;
                    }
                }
                visibleCount++;
                const chatWrap = document.createElement('div');
                chatWrap.className = 'file-tree-root';
                const chatRow = document.createElement('div');
                const rootKey = chat.id + '/';
                const isCollapsed = !!filesState.collapsed[rootKey];
                const isSelected = filesState.selectedChat === chat.id;
                chatRow.className = 'file-tree-node file-tree-folder' + (isCollapsed ? ' collapsed' : '') + (isSelected ? ' active' : '');
                chatRow.style.paddingLeft = '8px';
                chatRow.innerHTML =
                    '<svg class="ft-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
                    '<svg class="ft-icon" viewBox="0 0 24 24" fill="currentColor" style="color:#eab308"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>' +
                    '<span class="ft-name">' + escHtml(chat.title) + '</span>';
                chatRow.onclick = function () {
                    const switchingChat = filesState.selectedChat !== chat.id;
                    filesState.selectedChat = chat.id;
                    if (switchingChat) {
                        filesState.openFile = null;
                        filesState.openTabs = [];
                        filesState.dirty = {};
                    }
                    filesState.collapsed[rootKey] = !filesState.collapsed[rootKey];
                    render();
                };
                chatWrap.appendChild(chatRow);
                const chatChildren = document.createElement('div');
                chatChildren.className = 'file-tree-children';
                if (!isCollapsed) {
                    const relFiles = files.map(function (p) { return p.slice(chatDir(chat.id).length); });
                    const tree = buildTree(relFiles);
                    chatChildren.appendChild(renderTreeNode(tree, 1, '', chat.id));
                }
                chatWrap.appendChild(chatChildren);
                forest.appendChild(chatWrap);
            });
            if (!visibleCount) {
                const empty = document.createElement('div');
                empty.className = 'file-explorer-empty';
                empty.textContent = q ? 'No files match your search.' : 'No files. Click + to create one.';
                container.appendChild(empty);
                return;
            }
            container.appendChild(forest);
        }

        function buildTree(paths) {
            const root = {};
            paths.sort().forEach(function (p) {
                const parts = p.split('/');
                let node = root;
                parts.forEach(function (part, i) {
                    if (i === parts.length - 1) node[part] = { __file: p };
                    else { node[part] = node[part] || {}; node = node[part]; }
                });
            });
            return root;
        }

        function getChatName(chatId) {
            const chat = state.chats[chatId];
            return chat ? chat.title : chatId;
        }

        function getFileDisplayLabel(path) {
            const parts = String(path).split('/');
            const name = parts[parts.length - 1] || path;
            const chatId = parts[0] || '';
            const rel = parts.slice(1).join('/');
            if (!chatId || !rel) return path;
            return getChatName(chatId) + '/' + rel;
        }

        function renderTreeNode(node, depth, parentPath, chatId) {
            const wrap = document.createElement('div');
            const entries = Object.keys(node).sort(function (a, b) {
                const aF = !!node[a].__file, bF = !!node[b].__file;
                if (aF !== bF) return aF ? 1 : -1;
                return a.localeCompare(b);
            });
            entries.forEach(function (name) {
                const item = node[name];
                const pad = 8 + depth * 14;
                if (item.__file) {
                    const rel = item.__file;
                    const fullPath = chatId + '/' + rel;
                    const row = document.createElement('div');
                    row.className = 'file-tree-node' + (filesState.openFile === fullPath ? ' active' : '');
                    row.style.paddingLeft = pad + 'px';
                    row.innerHTML = fileIconHTML(name) + '<span class="ft-name">' + escHtml(name) + '</span>';
                    row.onclick = function () { openFile(fullPath); };
                    wrap.appendChild(row);
                } else {
                    const folderPath = parentPath ? parentPath + '/' + name : name;
                    const isCollapsed = !!filesState.collapsed[chatId + '/' + folderPath];
                    const folderRow = document.createElement('div');
                    folderRow.className = 'file-tree-node file-tree-folder' + (isCollapsed ? ' collapsed' : '');
                    folderRow.style.paddingLeft = pad + 'px';
                    folderRow.innerHTML =
                        '<svg class="ft-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
                        '<svg class="ft-icon" viewBox="0 0 24 24" fill="currentColor" style="color:#eab308"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>' +
                        '<span class="ft-name">' + escHtml(name) + '</span>';
                    folderRow.onclick = function () {
                        const key = chatId + '/' + folderPath;
                        filesState.collapsed[key] = !filesState.collapsed[key];
                        render();
                    };
                    wrap.appendChild(folderRow);
                    const children = document.createElement('div');
                    children.className = 'file-tree-children';
                    children.appendChild(renderTreeNode(item, depth + 1, folderPath, chatId));
                    wrap.appendChild(children);
                }
            });
            return wrap;
        }

        function fileIconHTML(name) {
            const cls = 'ft-icon';
            if (name.endsWith('.json')) return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="currentColor" style="color:#eab308"><path d="M4 4a2 2 0 012-2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>';
            if (name.endsWith('.html') || name.endsWith('.htm')) return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="currentColor" style="color:#f97316"><path d="M4 4a2 2 0 012-2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>';
            if (name.endsWith('.md')) return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="currentColor" style="color:#64748b"><path d="M4 4a2 2 0 012-2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>';
            if (name.endsWith('.js') || name.endsWith('.mjs')) return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="currentColor" style="color:#eab308"><path d="M4 4a2 2 0 012-2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>';
            if (name.endsWith('.ts') || name.endsWith('.tsx')) return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="currentColor" style="color:#3b82f6"><path d="M4 4a2 2 0 012-2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>';
            if (name.endsWith('.css')) return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="currentColor" style="color:#06b6d4"><path d="M4 4a2 2 0 012-2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>';
            if (name.endsWith('.py')) return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="currentColor" style="color:#3b82f6"><path d="M4 4a2 2 0 012-2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>';
            return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="currentColor" style="color:#94a3b8"><path d="M4 4a2 2 0 012-2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>';
        }

        function renderFileEditor() {
            const editor = document.createElement('div');
            editor.className = 'file-editor';

            if (!filesState.openFile) {
                const empty = document.createElement('div');
                empty.className = 'file-editor-empty';
                empty.innerHTML = '<div class="file-editor-empty-title">No file open</div>' +
                    '<div>Select a file from the explorer, or create a new one.</div>';
                editor.appendChild(empty);
                return editor;
            }

            // Open file tabs
            const tabsBar = document.createElement('div');
            tabsBar.className = 'file-editor-tabs';
            filesState.openTabs.forEach(function (path) {
                const tab = document.createElement('div');
                tab.className = 'file-editor-tab' + (path === filesState.openFile ? ' active' : '');
                const name = path.split('/').pop();
                tab.innerHTML = fileIconHTML(name) + '<span class="file-tab-label">' + escHtml(getFileDisplayLabel(path)) + '</span>';
                tab.onclick = function () { openFile(path, false); };
                const close = document.createElement('span');
                close.className = 'fet-close';
                close.textContent = '×';
                close.onclick = function (e) { e.stopPropagation(); closeFileTab(path); };
                tab.appendChild(close);
                tabsBar.appendChild(tab);
            });
            editor.appendChild(tabsBar);

            // Bar with path + save
            const bar = document.createElement('div');
            bar.className = 'file-editor-bar';
            const dirty = !!filesState.dirty[filesState.openFile];
            bar.innerHTML =
                '<span class="dirty-dot' + (dirty ? ' show' : '') + '"></span>' +
                '<span class="current-path" title="' + escHtml(filesState.openFile) + '">' + escHtml(getFileDisplayLabel(filesState.openFile)) + '</span>' +
                '<span class="spacer"></span>' +
                '<button class="save-btn" onclick="saveCurrentFile()">Save</button>';
            editor.appendChild(bar);

            // Code area: highlighted pre + transparent textarea overlay
            const codeArea = document.createElement('div');
            codeArea.className = 'code-area';

            const gutter = document.createElement('div');
            gutter.className = 'code-gutter';
            codeArea.appendChild(gutter);

            const codeWrap = document.createElement('div');
            codeWrap.className = 'code-wrap';
            const textarea = document.createElement('textarea');
            textarea.className = 'code-textarea';
            textarea.spellcheck = false;
            textarea.id = 'codeTextarea';
            textarea.placeholder = 'Type here...';
            textarea.wrap = 'off';

            const content = FS[filesState.openFile] || '';
            textarea.value = content;

            codeWrap.appendChild(textarea);
            codeArea.appendChild(codeWrap);
            editor.appendChild(codeArea);

            // Wire up events after DOM attached
            requestAnimationFrame(function () {
                updateLineNumbers(gutter, textarea);
                textarea.focus();
            });

            textarea.addEventListener('input', function () {
                filesState.dirty[filesState.openFile] = true;
                updateLineNumbers(gutter, textarea);
                updateDirtyDot();
                scheduleAutoSave();
            });
            textarea.addEventListener('scroll', function () {
                gutter.scrollTop = textarea.scrollTop;
            });
            textarea.addEventListener('keydown', function (e) {
                if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); saveCurrentFile(); }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const s = textarea.selectionStart, en = textarea.selectionEnd;
                    textarea.value = textarea.value.slice(0, s) + '  ' + textarea.value.slice(en);
                    textarea.selectionStart = textarea.selectionEnd = s + 2;
                    updateLineNumbers(gutter, textarea);
                }
            });

            return editor;
        }

        function scheduleAutoSave() {
            if (filesState.autosaveTimer) clearTimeout(filesState.autosaveTimer);
            filesState.autosaveTimer = setTimeout(function () {
                filesState.autosaveTimer = null;
                saveCurrentFile();
            }, 700);
        }

        function updateDirtyDot() {
            const dot = document.querySelector('.file-editor-bar .dirty-dot');
            if (dot) dot.classList.toggle('show', !!filesState.dirty[filesState.openFile]);
        }

        function updateLineNumbers(gutter, textarea) {
            const lines = textarea.value.split('\n').length;
            let html = '';
            for (let i = 1; i <= Math.max(lines, 24); i++) html += '<div>' + i + '</div>';
            gutter.innerHTML = html;
        }

        function openFile(path, switchTo) {
            if (!(path in FS)) return;
            if (filesState.openFile && filesState.dirty[filesState.openFile] && filesState.openFile !== path) saveCurrentFile();
            filesState.openFile = path;
            if (!filesState.openTabs.includes(path)) filesState.openTabs.push(path);
            render();
        }

        function closeFileTab(path) {
            const idx = filesState.openTabs.indexOf(path);
            if (idx !== -1) filesState.openTabs.splice(idx, 1);
            if (filesState.openFile === path) {
                filesState.openFile = filesState.openTabs[filesState.openTabs.length - 1] || null;
            }
            render();
        }

        function saveCurrentFile() {
            if (!filesState.openFile) return;
            const ta = document.getElementById('codeTextarea');
            if (!ta) return;
            FS[filesState.openFile] = ta.value;
            filesState.dirty[filesState.openFile] = false;
            saveFS();
            updateDirtyDot();
        }

        window.addEventListener('beforeunload', function () {
            if (filesState.autosaveTimer) {
                clearTimeout(filesState.autosaveTimer);
                filesState.autosaveTimer = null;
            }
            saveCurrentFile();
        });

        function newFilePrompt() {
            if (!filesState.selectedChat) { alert('Select or create a chat first.'); return; }
            const name = prompt('New file name (e.g. notes.md, script.js):');
            if (!name) return;
            const clean = name.replace(/^\/+/, '');
            const path = filesState.selectedChat + '/' + clean;
            if (path in FS) { alert('File already exists.'); return; }
            FS[path] = '';
            saveFS();
            openFile(path);
        }

        // ============================================================
        // Syntax highlighting — generic, "fits all languages"
        // Tokenizes comments, strings, numbers, keywords, function
        // calls, and HTML tags/attributes. Not perfect per-language,
        // but gives a pleasant colored view for any code.
        // ============================================================
        function highlightCode(code, path) {
            const lang = detectLang(path);
            let html = escHtml(code);
            // Order matters: comments first, then strings, then the rest.
            // We use a tokenizer approach to avoid nested replacements.

            const tokens = tokenize(code, lang);
            return tokens.map(function (t) {
                const text = escHtml(t.value);
                switch (t.type) {
                    case 'comment': return '<span class="tok-comment">' + text + '</span>';
                    case 'string': return '<span class="tok-string">' + text + '</span>';
                    case 'number': return '<span class="tok-number">' + text + '</span>';
                    case 'keyword': return '<span class="tok-keyword">' + text + '</span>';
                    case 'func': return '<span class="tok-func">' + text + '</span>';
                    case 'tag': return '<span class="tok-tag">' + text + '</span>';
                    case 'attr': return '<span class="tok-attr">' + text + '</span>';
                    case 'punct': return '<span class="tok-punct">' + text + '</span>';
                    default: return text;
                }
            }).join('');
        }

        function detectLang(path) {
            const n = path.toLowerCase();
            if (n.endsWith('.html') || n.endsWith('.htm')) return 'html';
            if (n.endsWith('.json')) return 'json';
            if (n.endsWith('.js') || n.endsWith('.mjs')) return 'js';
            if (n.endsWith('.ts') || n.endsWith('.tsx')) return 'js';
            if (n.endsWith('.css')) return 'css';
            if (n.endsWith('.py')) return 'py';
            if (n.endsWith('.md')) return 'md';
            return 'text';
        }

        const KEYWORDS = {
            js: ['const','let','var','function','return','if','else','for','while','do','switch','case','break','continue','new','class','extends','super','this','typeof','instanceof','in','of','try','catch','finally','throw','async','await','yield','import','export','from','default','null','undefined','true','false','void','delete'],
            py: ['def','return','if','elif','else','for','while','break','continue','import','from','as','class','try','except','finally','raise','with','lambda','yield','global','nonlocal','pass','None','True','False','and','or','not','in','is','del','assert'],
            css: ['important'],
            json: ['true','false','null'],
            md: [],
            html: [],
            text: []
        };

        function tokenize(code, lang) {
            const tokens = [];
            let i = 0;
            const len = code.length;
            const kws = KEYWORDS[lang] || KEYWORDS.text;

            function isWordChar(c) { return /[A-Za-z0-9_$]/.test(c); }
            function isDigit(c) { return /[0-9]/.test(c); }

            while (i < len) {
                const c = code[i];
                const two = code.slice(i, i + 2);

                // Line comments
                if (lang === 'js' || lang === 'css' || lang === 'py') {
                    if (two === '//' || (lang === 'py' && c === '#')) {
                        let j = i;
                        while (j < len && code[j] !== '\n') j++;
                        tokens.push({ type: 'comment', value: code.slice(i, j) });
                        i = j;
                        continue;
                    }
                }
                if (lang === 'html' || lang === 'md') {
                    if (c === '<' && code.slice(i, i + 4) === '<!--') {
                        let j = code.indexOf('-->', i);
                        if (j === -1) j = len; else j += 3;
                        tokens.push({ type: 'comment', value: code.slice(i, j) });
                        i = j;
                        continue;
                    }
                }

                // Block comments
                if (two === '/*') {
                    let j = code.indexOf('*/', i + 2);
                    if (j === -1) j = len; else j += 2;
                    tokens.push({ type: 'comment', value: code.slice(i, j) });
                    i = j;
                    continue;
                }

                // Strings
                if (c === '"' || c === "'" || c === '`') {
                    const quote = c;
                    let j = i + 1;
                    while (j < len) {
                        if (code[j] === '\\') { j += 2; continue; }
                        if (code[j] === quote) { j++; break; }
                        j++;
                    }
                    tokens.push({ type: 'string', value: code.slice(i, j) });
                    i = j;
                    continue;
                }

                // Numbers
                if (isDigit(c) || (c === '.' && isDigit(code[i + 1]))) {
                    let j = i + 1;
                    while (j < len && /[0-9a-fA-FxX._eE+\-]/.test(code[j])) {
                        // stop on +/- if not part of exponent
                        if ((code[j] === '+' || code[j] === '-') && !/[eE]/.test(code[j - 1])) break;
                        j++;
                    }
                    tokens.push({ type: 'number', value: code.slice(i, j) });
                    i = j;
                    continue;
                }

                // HTML tags & attributes
                if (lang === 'html' && c === '<') {
                    let j = i + 1;
                    if (code[j] === '/') j++;
                    // tag name
                    let m = j;
                    while (m < len && /[A-Za-z0-9!-]/.test(code[m])) m++;
                    if (m > j) {
                        tokens.push({ type: 'punct', value: code.slice(i, j) });
                        tokens.push({ type: 'tag', value: code.slice(j, m) });
                        j = m;
                        // attributes until >
                        while (j < len && code[j] !== '>') {
                            if (code[j] === '"' || code[j] === "'") {
                                const q = code[j]; let k = j + 1;
                                while (k < len && code[k] !== q) k++;
                                k++;
                                tokens.push({ type: 'string', value: code.slice(j, k) });
                                j = k;
                                continue;
                            }
                            // attr name
                            let a = j;
                            while (a < len && /[A-Za-z0-9_:-]/.test(code[a])) a++;
                            if (a > j) {
                                tokens.push({ type: 'attr', value: code.slice(j, a) });
                                j = a;
                                continue;
                            }
                            j++;
                        }
                        if (j < len) { tokens.push({ type: 'punct', value: code[j] }); j++; }
                        i = j;
                        continue;
                    }
                }

                // Words (keywords / functions / identifiers)
                if (isWordChar(c)) {
                    let j = i + 1;
                    while (j < len && isWordChar(code[j])) j++;
                    const word = code.slice(i, j);
                    // function call? next non-space char is '('
                    let k = j;
                    while (k < len && /\s/.test(code[k])) k++;
                    if (kws.includes(word)) {
                        tokens.push({ type: 'keyword', value: word });
                    } else if (code[k] === '(' && (lang === 'js' || lang === 'py' || lang === 'text')) {
                        tokens.push({ type: 'func', value: word });
                    } else {
                        tokens.push({ type: 'word', value: word });
                    }
                    i = j;
                    continue;
                }

                // Punctuation
                if (/[{}[\]();,]/.test(c)) {
                    tokens.push({ type: 'punct', value: c });
                    i++;
                    continue;
                }

                // Default: single char
                tokens.push({ type: 'text', value: c });
                i++;
            }
            return tokens;
        }

        function escHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================================================
        // Settings
        // ============================================================
        function openSettings() {
            document.getElementById('settingsModal').classList.add('open');
            renderAccentPresets();
            const picker = document.getElementById('accentColorPicker');
            if (picker) picker.value = state.accentColor;
            closeMobileSidebar();
        }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }

        // ============================================================
        // Optimise Prompt
        // ============================================================
        let optimiseState = {
            chatId: null,
            originalPrompt: '',
            questionnaireData: null
        };

        function startOptimisePrompt(chatId) {
            const input = document.getElementById('chatInput-' + chatId);
            const text = input.value.trim();
            if (!text) {
                alert('Please enter a prompt to optimise.');
                return;
            }

            optimiseState.chatId = chatId;
            optimiseState.originalPrompt = text;

            // Show modal with loading state
            document.getElementById('questionnaireModal').classList.add('open');
            document.getElementById('questionnaireBody').innerHTML =
                '<div class="questionnaire-loading">' +
                '<div class="ai-loading"><div class="ai-loading-ring"></div></div>' +
                '<div>Generating questionnaire...</div>' +
                '</div>';
            document.getElementById('questionnaireFooter').style.display = 'none';

            // Generate questionnaire using mistral-small-2506
            generateQuestionnaire(text);
        }

        async function generateQuestionnaire(prompt) {
            try {
                const response = await fetch(CHAT_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'mistral-small-2506',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a prompt engineering assistant. Your task is to generate a questionnaire to gather details that will help optimise the user\'s prompt. Return ONLY a JSON object with this exact structure: {"questions": [{"id": "q1", "label": "Question text", "type": "text|textarea|select", "options": ["option1", "option2"] (only if type is select)}]}. Generate 3-5 relevant questions based on the prompt context.'
                            },
                            {
                                role: 'user',
                                content: 'Generate a questionnaire to help optimise this prompt: ' + prompt
                            }
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to generate questionnaire: ' + response.statusText);
                }

                const data = await response.json();
                const content = data.choices[0].message.content;

                // Parse the JSON response
                const jsonMatch = content.match(/\{[\s\S]*\}/);
                if (!jsonMatch) {
                    throw new Error('Invalid response format');
                }

                const questionnaire = JSON.parse(jsonMatch[0]);
                optimiseState.questionnaireData = questionnaire;

                // Render the questionnaire form
                renderQuestionnaireForm(questionnaire);

            } catch (error) {
                console.error('Error generating questionnaire:', error);
                document.getElementById('questionnaireBody').innerHTML =
                    '<div style="color: var(--danger); padding: 20px; text-align: center;">' +
                    'Error generating questionnaire: ' + error.message +
                    '</div>';
            }
        }

        function renderQuestionnaireForm(questionnaire) {
            const body = document.getElementById('questionnaireBody');
            body.innerHTML = '';

            if (!questionnaire.questions || questionnaire.questions.length === 0) {
                body.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">No questions generated. Please try again.</div>';
                return;
            }

            questionnaire.questions.forEach(function (q) {
                const item = document.createElement('div');
                item.className = 'questionnaire-item';

                const label = document.createElement('label');
                label.textContent = q.label;
                label.htmlFor = q.id;
                item.appendChild(label);

                let input;
                if (q.type === 'textarea') {
                    input = document.createElement('textarea');
                    input.id = q.id;
                    input.placeholder = 'Enter your answer...';
                } else if (q.type === 'select' && q.options && q.options.length > 0) {
                    input = document.createElement('select');
                    input.id = q.id;
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = 'Select an option...';
                    input.appendChild(defaultOption);
                    q.options.forEach(function (opt) {
                        const option = document.createElement('option');
                        option.value = opt;
                        option.textContent = opt;
                        input.appendChild(option);
                    });
                } else {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.id = q.id;
                    input.placeholder = 'Enter your answer...';
                }

                item.appendChild(input);
                body.appendChild(item);
            });

            // Show footer buttons
            document.getElementById('questionnaireFooter').style.display = 'flex';
        }

        async function submitQuestionnaire() {
            const questionnaire = optimiseState.questionnaireData;
            if (!questionnaire || !questionnaire.questions) {
                alert('No questionnaire data available.');
                return;
            }

            // Collect answers
            const answers = {};
            questionnaire.questions.forEach(function (q) {
                const input = document.getElementById(q.id);
                if (input) {
                    answers[q.label] = input.value;
                }
            });

            // Show loading state
            document.getElementById('questionnaireBody').innerHTML =
                '<div class="questionnaire-loading">' +
                '<div class="ai-loading"><div class="ai-loading-ring"></div></div>' +
                '<div>Optimising prompt...</div>' +
                '</div>';
            document.getElementById('questionnaireFooter').style.display = 'none';

            try {
                // Build the optimisation prompt
                const optimisationPrompt = 'Original prompt: ' + optimiseState.originalPrompt + '\n\n' +
                    'User answers to questionnaire:\n' +
                    Object.entries(answers).map(function ([key, value]) {
                        return key + ': ' + value;
                    }).join('\n') +
                    '\n\nBased on the original prompt and the user\'s answers, please provide an optimised and expanded version of the prompt. Return ONLY the optimised prompt text, no explanations or additional text.';

                const response = await fetch(CHAT_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'mistral-small-2506',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are an expert prompt engineer. Your task is to optimise and expand prompts based on user requirements and context. Return ONLY the optimised prompt text, nothing else.'
                            },
                            {
                                role: 'user',
                                content: optimisationPrompt
                            }
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to optimise prompt: ' + response.statusText);
                }

                const data = await response.json();
                const optimisedPrompt = data.choices[0].message.content.trim();

                // Update the input field with the optimised prompt
                const input = document.getElementById('chatInput-' + optimiseState.chatId);
                if (input) {
                    input.value = optimisedPrompt;
                    autoGrow(input);
                }

                // Close the modal
                closeQuestionnaireModal();

            } catch (error) {
                console.error('Error optimising prompt:', error);
                document.getElementById('questionnaireBody').innerHTML =
                    '<div style="color: var(--danger); padding: 20px; text-align: center;">' +
                    'Error optimising prompt: ' + error.message +
                    '</div>';
                document.getElementById('questionnaireFooter').style.display = 'flex';
            }
        }

        function closeQuestionnaireModal() {
            document.getElementById('questionnaireModal').classList.remove('open');
            optimiseState = {
                chatId: null,
                originalPrompt: '',
                questionnaireData: null
            };
        }

        // ============================================================
        // Clock (dashboard)
        // ============================================================
        function updateClock() {
            const timeEl = document.getElementById('timeDisplay');
            const dateEl = document.getElementById('dateDisplay');
            const greetEl = document.getElementById('greeting');
            if (!timeEl) return;
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            dateEl.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
            const h = now.getHours();
            greetEl.textContent = h < 12 ? 'Good morning!' : h < 18 ? 'Good afternoon!' : 'Good evening!';
        }
        setInterval(updateClock, 15000);

        // ============================================================
        // Init
        // ============================================================
        loadState();
        applyTheme();
        applyAccentColor();
        fetchModels().then(function () {
            render();
        }).catch(function () {
            // Fallback to hardcoded models if fetch fails
            render();
        });
    </script>
